<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cranfield Search Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #ec4899;
            --secondary: #8b5cf6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-top: 10vh;
            text-align: center;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .search-container {
            margin-top: 2.5rem;
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
        }

        .search-box {
            width: 100%;
            padding: 1.2rem 1.5rem;
            padding-right: 100px;
            font-size: 1.2rem;
            color: var(--text);
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.2);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            bottom: 8px;
            padding: 0 1.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        .tokens-display {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 30px;
        }

        .token {
            background: rgba(139, 92, 246, 0.2);
            color: #d8b4fe;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(139, 92, 246, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        .results-container {
            margin-top: 2rem;
            width: 100%;
            max-width: 800px;
            padding: 0 1rem;
            padding-bottom: 4rem;
        }

        .stats {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-align: right;
        }

        .result-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, border-color 0.3s;
            animation: slideUp 0.5s ease-out both;
        }

        .result-card:hover {
            transform: translateY(-3px);
            border-color: rgba(139, 92, 246, 0.5);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .doc-id {
            font-weight: 600;
            color: var(--text);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .doc-id::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
        }

        .score {
            background: rgba(236, 72, 153, 0.1);
            color: var(--primary);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .snippet {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 3rem auto;
        }

        .sample-container {
            margin-top: 1.5rem;
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .sample-select {
            padding: 0.8rem 1.2rem;
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ec4899' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .sample-select option {
            background-color: var(--bg);
            color: var(--text);
        }

        .ground-truth-box {
            display: none;
            margin-top: 1.5rem;
            width: 100%;
            max-width: 800px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 1rem;
            color: #10b981;
            font-size: 0.9rem;
            animation: fadeIn 0.5s ease-out;
        }

        .ground-truth-title {
            font-weight: 800;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ground-truth-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .gt-item {
            background: rgba(16, 185, 129, 0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .answer-box {
            display: none;
            margin-top: 2rem;
            width: 100%;
            max-width: 800px;
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            color: var(--text);
            font-size: 1.05rem;
            line-height: 1.6;
            animation: slideUp 0.5s ease-out;
        }

        .answer-title {
            font-weight: 800;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-size: 1.2rem;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Cranfield Search</h1>
        <p class="subtitle">Vector Space Model (lnc.ltc)</p>
    </header>

    <div class="search-container">
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" class="search-box" placeholder="What similarity laws must be obeyed?..."
                onkeypress="handleKeyPress(event)">
            <button class="search-btn" onclick="performSearch()">Search</button>
        </div>
        <div class="sample-container">
            <select id="sampleSelect" class="sample-select" onchange="loadSampleQuery()">
                <option value="">-- Or select a Sample Query to test --</option>
            </select>
        </div>
        <div class="tokens-display" id="tokensDisplay"></div>
    </div>

    <div class="ground-truth-box" id="groundTruthBox">
        <div class="ground-truth-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            Official Ground Truth (Expected Docs)
        </div>
        <div class="ground-truth-items" id="groundTruthItems"></div>
    </div>

    <div class="loader" id="loader"></div>

    <div class="answer-box" id="answerBox">
        <div class="answer-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            Answer (RAG)
        </div>
        <div class="answer-content" id="answerContent"></div>
    </div>

    <div class="results-container" id="resultsContainer">
        <!-- Results will be injected here -->
    </div>

    <script>
        let sampleQueries = [];

        // Load sample queries on startup
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/samples')
                sampleQueries = await response.json();

                const select = document.getElementById('sampleSelect');
                sampleQueries.forEach((q, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `Query ${q.id}: ${q.text.substring(0, 60)}...`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error("Failed to load sample queries", e);
            }
        });

        function loadSampleQuery() {
            const select = document.getElementById('sampleSelect');
            const index = select.value;
            if (index === "") {
                document.getElementById('groundTruthBox').style.display = 'none';
                return;
            }

            const q = sampleQueries[index];
            document.getElementById('searchInput').value = q.text;

            // Display Ground Truth
            const gtBox = document.getElementById('groundTruthBox');
            const gtItems = document.getElementById('groundTruthItems');
            gtItems.innerHTML = '';

            q.ground_truth.forEach(gt => {
                const el = document.createElement('div');
                el.className = 'gt-item';
                el.innerText = `Doc #${gt.doc_id} (Rel: ${gt.relevance})`;
                gtItems.appendChild(el);
            });

            gtBox.style.display = 'block';

            // Auto trigger search
            performSearch();
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query.trim()) return;

            const loader = document.getElementById('loader');
            const resultsContainer = document.getElementById('resultsContainer');
            const tokensDisplay = document.getElementById('tokensDisplay');
            const answerBox = document.getElementById('answerBox');
            const answerContent = document.getElementById('answerContent');

            resultsContainer.innerHTML = '';
            tokensDisplay.innerHTML = '';
            
            // 1. Show answer box immediately with loading state
            answerBox.style.display = 'block';
            answerContent.innerHTML = '<span style="color: var(--text-muted); font-style: italic; animation: pulse 1.5s infinite;">Generating intelligent summary based on top results...</span>';
            
            loader.style.display = 'block';

            try {
                // STEP 1: Get VSM Results (FAST)
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, k: 10 })
                });

                const data = await response.json();
                loader.style.display = 'none';

                // Display Tokens
                if (data.query_tokens) {
                    data.query_tokens.forEach(token => {
                        const span = document.createElement('span');
                        span.className = 'token';
                        span.innerText = token;
                        tokensDisplay.appendChild(span);
                    });
                }

                // Display Stats
                if (data.results && data.results.length > 0) {
                    const stats = document.createElement('div');
                    stats.className = 'stats';
                    stats.innerText = `Found ${data.results.length} results in ${data.time_ms}ms`;
                    resultsContainer.appendChild(stats);
                    
                    // Display Results
                    data.results.forEach((item, index) => {
                        const delay = index * 0.05; 
                        const card = document.createElement('div');
                        card.className = 'result-card';
                        card.style.animationDelay = `${delay}s`;
                        card.innerHTML = `
                            <div class="result-header">
                                <div class="doc-id">Document #${item.doc_id}</div>
                                <div class="score">Score: ${item.score}</div>
                            </div>
                            <div class="snippet">${item.snippet}</div>
                        `;
                        resultsContainer.appendChild(card);
                    });

                    // STEP 2: Get RAG Answer (SLOW - in background)
                    fetch('/api/answer', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: query, results: data.results })
                    })
                    .then(res => res.json())
                    .then(answerData => {
                        answerContent.innerText = answerData.answer;
                    })
                    .catch(err => {
                        answerContent.innerText = "Error generating AI answer.";
                    });

                } else {
                    resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 3rem;">No relevant documents found.</div>';
                    answerBox.style.display = 'none';
                }

            } catch (err) {
                loader.style.display = 'none';
                resultsContainer.innerHTML = '<div style="color: #ef4444; text-align: center; margin-top: 2rem;">Error connecting to server.</div>';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }
    </script>
</body>

</html>
